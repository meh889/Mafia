# Laboratorio (solo en esta rama descartable): capturas en alta densidad con las
# tipografías de verdad, para armar la imagen resumen de las novedades.
name: Laboratorio WebKit
on:
  push:
    branches: ["claude/prueba-permisos"]
permissions:
  contents: read
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUENTES: "1"
      DPR: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Instalar navegadores
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps webkit chromium
          mkdir -p "$RUNNER_TEMP/out/webkit" "$RUNNER_TEMP/out/chromium"
      - name: WebKit
        if: always()
        run: |
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules" MOTOR=webkit SALIDA="$RUNNER_TEMP/out/webkit"
          for t in b c1; do echo "=== $t"; node .github/pruebas/$t.cjs || echo "### $t terminó con error"; done
      - name: Chromium (avisos y taller)
        if: always()
        run: |
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules" MOTOR=chromium SALIDA="$RUNNER_TEMP/out/chromium"
          for t in d a; do echo "=== $t"; node .github/pruebas/$t.cjs || echo "### $t terminó con error"; done
      - name: Volcar capturas
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          for f in webkit/*.jpg chromium/*.jpg; do [ -f "$f" ] || continue; base64 -w 3000 "$f" | awk -v n="$f" '{print "###IMG " n " " NR " " $0}'; done
