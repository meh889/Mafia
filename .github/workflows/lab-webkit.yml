# Laboratorio (solo en esta rama descartable): prueba lo que todavía no se publicó,
# en WebKit y Chromium, con las tipografías de verdad y capturas nítidas.
name: Laboratorio WebKit
on:
  push:
    branches: ["claude/prueba-permisos"]
permissions:
  contents: read
jobs:
  previo:
    name: Previo en ${{ matrix.motor }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        motor: [webkit, chromium]
    env:
      MOTOR: ${{ matrix.motor }}
      FUENTES: "1"
      DPR: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Instalar navegador
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.motor }}
          mkdir -p "$RUNNER_TEMP/out"
      - name: Ponyta se va y vuelve
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/out" node .github/pruebas/e.cjs
      - name: Prueba de humo
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node .github/scripts/probar.cjs
      - name: Los demás escenarios
        if: always()
        run: |
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/out2"; mkdir -p "$SALIDA"; mal=0
          for t in a b c2; do echo "=== $t"; node .github/pruebas/$t.cjs || mal=1; done; exit $mal
      - name: Volcar capturas
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          for f in *.jpg; do [ -f "$f" ] || continue; base64 -w 3000 "$f" | awk -v n="${{ matrix.motor }}/$f" '{print "###IMG " n " " NR " " $0}'; done
