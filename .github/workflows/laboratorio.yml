# Las pruebas largas ("escenarios") de lo que se sumó en noviembre de 2026:
# actualización sola, respaldo, taller, ida y vuelta por WhatsApp, MafiaTCG (cartas,
# sobres y duelo), la tienda con la ropa de Ponyta y el modo Pou, avisos, el viaje de Ponyta
# y el adviento (tres escenarios: g, h, i).
# No corren solas: se piden a mano cuando se toca ese código (o cuando hay dudas).
#
#   gh workflow run laboratorio.yml -R meh889/Mafia --ref main
#
# Corren en WebKit (el motor de Safari, el del iPhone) y en Chromium, con las
# tipografías de verdad, y dejan capturas volcadas en el registro. Para bajarlas:
#
#   gh run view <id> -R meh889/Mafia --log | node .github/pruebas/rearmar.cjs <carpeta>
#
# Con "-f densidad=2" las capturas salen al doble de resolución (para mostrarlas).
name: Laboratorio

on:
  workflow_dispatch:
    inputs:
      capturas:
        description: "Volcar las capturas en el registro"
        type: boolean
        default: true
      densidad:
        description: "Densidad de las capturas (2 = más nítidas, registro más pesado)"
        type: choice
        options: ["1", "2"]
        default: "1"

permissions:
  contents: read

jobs:
  escenarios:
    name: Escenarios en ${{ matrix.motor }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        motor: [webkit, chromium]
    env:
      MOTOR: ${{ matrix.motor }}
      FUENTES: "1"
      DPR: ${{ inputs.densidad || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Instalar el navegador de prueba
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright web-push@4
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.motor }}
          mkdir -p "$RUNNER_TEMP/capturas"
      - name: Actualización, respaldo, taller y sonido
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/a.cjs
      - name: Ida y vuelta (contestar, la tienda sin puntos, vales)
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/b.cjs
      - name: MafiaTCG, cartas, sobres y carpeta
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/c2.cjs
      - name: MafiaTCG, recorrido con capturas
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/c1.cjs
      - name: MafiaTCG, el duelo
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/c3.cjs
      # Las reglas del duelo y el equilibrio de las cartas no usan navegador: alcanza con correrlas una vez.
      - name: MafiaTCG, reglas del duelo y equilibrio
        if: always() && matrix.motor == 'chromium'
        run: node .github/pruebas/c4.cjs
      - name: La tienda, la ropa de Ponyta y el modo Pou
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/f.cjs
      - name: Ponyta se va de vacaciones y vuelve con gorro
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/e.cjs
      - name: El adviento (la lista, el papelito, el mapa, el cofre, los vales, el cupón y el 1 de enero)
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/g.cjs
      - name: El adviento, las ventanitas que se juegan (la ruleta, los penales y la Generala)
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/h.cjs
      - name: El adviento, los regalos para Ponyta, el Lego, la carta, el sobre, las citas y el alemán
        if: always()
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/i.cjs
      # Los avisos se prueban con herramientas que solo tiene Chromium (el permiso de
      # notificaciones y la entrega de un push de mentira al service worker).
      - name: Avisos, del lado de la app
        if: always() && matrix.motor == 'chromium'
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" SALIDA="$RUNNER_TEMP/capturas" node .github/pruebas/d.cjs
      - name: Avisos, el envío
        if: always() && matrix.motor == 'chromium'
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node .github/pruebas/d-envio.cjs
      - name: Volcar capturas
        if: always() && inputs.capturas
        run: |
          cd "$RUNNER_TEMP/capturas"
          for f in *.jpg; do
            [ -f "$f" ] || continue
            base64 -w 3000 "$f" | awk -v n="${{ matrix.motor }}/$f" '{print "###IMG " n " " NR " " $0}'
          done
