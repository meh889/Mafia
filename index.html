      const bOk=document.querySelector(`#actividad .trivia-op[data-i="${correcta}"]`);
      if(bOk) bOk.classList.add("ok");
      if(i===correcta){ r.textContent=a.acierto||"¡Exacto!"; r.className="result ok"; celebrar(); }
      else { b.classList.add("bad"); r.textContent=a.error||"No…"; r.className="result bad"; }
    });
  });
}

/* ===== ordenar la frase ===== */
function montarOrden(a){
  const frase=(a.frase||"TE AMO MUCHO").trim().split(/\s+/);
  function armar(){
    const mezcla=[...frase].sort(()=>Math.random()-0.5);
    if(frase.length>1 && mezcla.join(" ")===frase.join(" ")) return armar();
    return mezcla;
  }
  cont.innerHTML=`
    <div class="box">
      <p class="note">tocá las palabras en orden para armar la frase</p>
      <div class="orden-zona" id="orZona"></div>
      <div class="orden-chips" id="orChips"></div>
      <div class="result" id="orResult"></div>
      <button class="btn" id="orReset">Empezar de nuevo</button>
    </div>`;
  let elegidas=[];
  function pintar(rest){
    const z=document.getElementById("orZona"), c=document.getElementById("orChips");
    z.innerHTML=""; c.innerHTML="";
    elegidas.forEach((w,i)=>{
      const b=document.createElement("button"); b.className="orden-chip"; b.textContent=w;
      b.addEventListener("click",()=>{ elegidas.splice(i,1); rest.push(w); pintar(rest); });
      z.appendChild(b);
    });
    rest.forEach((w,i)=>{
      const b=document.createElement("button"); b.className="orden-chip"; b.textContent=w;
      b.addEventListener("click",()=>{
        rest.splice(i,1); elegidas.push(w); pintar(rest);
        if(!rest.length){
          const r=document.getElementById("orResult");
          if(elegidas.join(" ")===frase.join(" ")){
            r.textContent="Frase perfecta."; r.className="result ok"; celebrar();
          } else { r.textContent="Hmm, ese orden no era…"; r.className="result bad"; }
        }
      });
      c.appendChild(b);
    });
  }
  let resto=armar();
  document.getElementById("orReset").addEventListener("click",()=>{
    elegidas=[]; resto=armar();
    document.getElementById("orResult").textContent="";
    pintar(resto);
  });
  pintar(resto);
  window._dbg=window._dbg||{}; window._dbg.orden={frase, elegir:(w)=>{ [...document.getElementById("orChips").children].find(b=>b.textContent===w).click(); }};
}

/* ===== adivinar el número ===== */
function montarNumero(a){
  const MAX=Math.max(10,parseInt(a.max,10)||100);
  const TRIES=Math.max(3,parseInt(a.intentos,10)||7);
  let target, restan, fin;
  cont.innerHTML=`
    <div class="box">
      <p class="note">pensé un número del 1 al ${MAX}. Tenés <b id="nuRestan"></b> intentos.</p>
      <div class="juego-input">
        <input id="nuIn" type="number" min="1" max="${MAX}" placeholder="tu número…">
        <button class="btn" id="nuBtn">Probar</button>
      </div>
      <div class="result" id="nuResult"></div>
      <button class="btn" id="nuRetry" style="display:none">Otra vez</button>
    </div>`;
  function empezar(){
    target=1+Math.floor(Math.random()*MAX); restan=TRIES; fin=false;
    document.getElementById("nuRestan").textContent=restan;
    document.getElementById("nuResult").textContent="";
    document.getElementById("nuRetry").style.display="none";
    document.getElementById("nuIn").value="";
  }
  function probar(){
    if(fin) return;
    const v=parseInt(document.getElementById("nuIn").value,10);
    const r=document.getElementById("nuResult");
    if(!v||v<1||v>MAX){ r.textContent="Poné un número válido."; r.className="result bad"; return; }
    restan--; document.getElementById("nuRestan").textContent=restan;
    if(v===target){ fin=true; r.textContent=`¡${target}! Nos leemos la mente.`; r.className="result ok"; celebrar(); return; }
    if(restan<=0){ fin=true; r.textContent=`Era ${target}… la próxima seguro.`; r.className="result bad";
      document.getElementById("nuRetry").style.display="inline-block"; return; }
    r.textContent = v<target ? "Más grande ↑" : "Más chico ↓";
    r.className="result";
    document.getElementById("nuIn").value=""; document.getElementById("nuIn").focus();
  }
  document.getElementById("nuBtn").addEventListener("click",probar);
  document.getElementById("nuIn").addEventListener("keydown",e=>{ if(e.key==="Enter")probar(); });
  document.getElementById("nuRetry").addEventListener("click",empezar);
  empezar();
  window._dbg=window._dbg||{}; window._dbg.numero={get:()=>target};
}

/* ===== test de reacción ===== */
function montarReaccion(){
  const RONDAS=3, LIMITE=650;
  cont.innerHTML=`
    <div class="box">
      <p class="note">cuando la caja se ponga verde, tocala lo más rápido que puedas. ${RONDAS} rondas.</p>
      <div id="reacZona"><span id="reacTxt">tocá para empezar</span><span id="reacSub" style="font-size:.8rem;font-weight:600;color:var(--ink-soft)"></span></div>
      <div class="result" id="reacResult"></div>
    </div>`;
  const z=document.getElementById("reacZona");
  let estado="inicio", timer=null, t0=0, tiempos=[];
  const txt=(a,b)=>{ document.getElementById("reacTxt").textContent=a; document.getElementById("reacSub").textContent=b||""; };
  function esperar(){
    estado="esperando"; z.className="esperando"; z.id="reacZona";
    txt("esperá…", `ronda ${tiempos.length+1} de ${RONDAS}`);
    timer=setTimeout(()=>{ estado="listo"; z.classList.remove("esperando"); z.classList.add("listo"); txt("¡TOCÁ!"); t0=Date.now(); },900+Math.random()*2100);
  }
  function ganarR(){ 
    const r=document.getElementById("reacResult");
    const avg=Math.round(tiempos.reduce((s,x)=>s+x,0)/tiempos.length);
    if(avg<=LIMITE){ r.textContent=`Promedio ${avg}ms. Reflejos de gata.`; r.className="result ok"; celebrar(); }
    else { r.textContent=`Promedio ${avg}ms… casi. Tocá para reintentar.`; r.className="result bad"; }
    estado="inicio"; z.className=""; txt("tocá para empezar de nuevo");
    tiempos=[];
  }
  z.addEventListener("click",()=>{
    if(estado==="inicio"){ document.getElementById("reacResult").textContent=""; esperar(); return; }
    if(estado==="esperando"){ clearTimeout(timer); z.className=""; txt("¡muy pronto! tocá para reintentar la ronda"); estado="inicio2"; return; }
    if(estado==="inicio2"){ esperar(); return; }
    if(estado==="listo"){
      tiempos.push(Date.now()-t0);
      z.classList.remove("listo");
      if(tiempos.length>=RONDAS){ ganarR(); }
      else esperar();
    }
  });
  window._dbg=window._dbg||{}; window._dbg.reaccion={win:()=>{ tiempos=[200,200,200]; ganarR(); }};
}

/* ===== topo (whack-a-mole) ===== */
function montarTopo(a){
  const META=Math.max(5,parseInt(a.aciertos,10)||10), DUR=25;
  cont.innerHTML=`
    <div class="box">
      <div class="atrapar-hud"><span id="tpPts">🐹 0 / ${META}</span><span id="tpTiempo">${DUR}s</span></div>
      <div id="topoGrid"></div>
      <div class="result" id="tpResult"></div>
      <button class="btn" id="tpBtn">Jugar</button>
    </div>`;
  const g=document.getElementById("topoGrid");
  const hoyos=[];
  for(let i=0;i<9;i++){
    const h=document.createElement("button");
    h.className="topo-hoyo"; h.textContent="";
    h.addEventListener("click",()=>{
      if(!activo||h.textContent!=="🐹") return;
      pts++; h.textContent="💥";
      setTimeout(()=>{ if(h.textContent==="💥") h.textContent=""; },200);
      document.getElementById("tpPts").textContent=`🐹 ${pts} / ${META}`;
      if(pts>=META) terminar(true);
    });
    g.appendChild(h); hoyos.push(h);
  }
  let pts=0, resta=DUR, activo=false, spawner=null, reloj=null;
  function limpiar(){ clearInterval(spawner); clearInterval(reloj); activo=false; hoyos.forEach(h=>h.textContent=""); }
  function terminar(win){
    limpiar();
    const r=document.getElementById("tpResult");
    r.textContent = win ? "¡Los agarraste a todos!" : `${pts} de ${META}… se te escaparon.`;
    r.className="result "+(win?"ok":"bad");
    if(win) celebrar();
    else { const b=document.getElementById("tpBtn"); b.style.display="inline-block"; b.textContent="Reintentar"; }
  }
  window._dbg=window._dbg||{}; window._dbg.topo={win:()=>{pts=META;terminar(true);}};
  document.getElementById("tpBtn").addEventListener("click",function(){
    this.style.display="none";
    document.getElementById("tpResult").textContent="";
    pts=0; resta=DUR; activo=true;
    document.getElementById("tpPts").textContent=`🐹 0 / ${META}`;
    document.getElementById("tpTiempo").textContent=DUR+"s";
    spawner=setInterval(()=>{
      hoyos.forEach(h=>{ if(h.textContent==="🐹") h.textContent=""; });
      hoyos[Math.floor(Math.random()*9)].textContent="🐹";
    },720);
    reloj=setInterval(()=>{
      resta--; document.getElementById("tpTiempo").textContent=resta+"s";
      if(resta<=0) terminar(pts>=META);
    },1000);
  });
}

/* ===== cajafuerte (descifrar el código) ===== */
function montarCajafuerte(a){
  const CODE=String(a.codigo||"1234").replace(/\D/g,"");
  const L=CODE.length, MAXT=6;
  cont.innerHTML=`
    <div class="box">
      <p class="note">🔐 código de ${L} dígitos, ${MAXT} intentos.${a.pista?` Pista: <b>${a.pista}</b>`:""}</p>
      <div class="caja-intentos" id="cjIntentos"></div>
      <div class="juego-input">
        <input id="cjIn" type="tel" inputmode="numeric" maxlength="${L}" placeholder="${"•".repeat(L)}">
        <button class="btn" id="cjBtn">Probar</button>
      </div>
      <p class="note" style="margin-top:8px">🟩 dígito correcto en su lugar · 🟨 está pero en otro lugar</p>
      <div class="result" id="cjResult"></div>
      <button class="btn" id="cjRetry" style="display:none">Otra vez</button>
    </div>`;
  let usados=0, fin=false;
  function probar(){
    if(fin) return;
    const v=String(document.getElementById("cjIn").value||"").replace(/\D/g,"");
    const r=document.getElementById("cjResult");
    if(v.length!==L){ r.textContent=`Tienen que ser ${L} dígitos.`; r.className="result bad"; return; }
    usados++;
    const fila=document.createElement("div"); fila.className="caja-fila";
    const restoCode=CODE.split(""), marca=Array(L).fill("no");
    for(let i=0;i<L;i++) if(v[i]===CODE[i]){ marca[i]="ok"; restoCode[i]=null; }
    for(let i=0;i<L;i++) if(marca[i]==="no"){ const j=restoCode.indexOf(v[i]); if(j>=0){ marca[i]="casi"; restoCode[j]=null; } }
    for(let i=0;i<L;i++){
      const d=document.createElement("div");
      d.className="caja-dig"+(marca[i]==="ok"?" ok":marca[i]==="casi"?" casi":"");
      d.textContent=v[i]; fila.appendChild(d);
    }
    document.getElementById("cjIntentos").appendChild(fila);
    document.getElementById("cjIn").value="";
    if(v===CODE){ fin=true; r.textContent="🔓 ¡Abierta! Sabés demasiado."; r.className="result ok"; celebrar(); return; }
    if(usados>=MAXT){ fin=true; r.textContent="Se trabó la caja… reintentá."; r.className="result bad";
      document.getElementById("cjRetry").style.display="inline-block"; return; }
    r.textContent=`Intento ${usados} de ${MAXT}.`; r.className="result";
  }
  document.getElementById("cjBtn").addEventListener("click",probar);
  document.getElementById("cjIn").addEventListener("keydown",e=>{ if(e.key==="Enter")probar(); });
  document.getElementById("cjRetry").addEventListener("click",()=>montarCajafuerte(a));
  window._dbg=window._dbg||{}; window._dbg.caja={code:CODE,probar,input:()=>document.getElementById("cjIn")};
}

/* ===== verdad o falso ===== */
function montarVerdadFalso(a){
  const frases=(a.frases||[]).filter(f=>f&&f.t);
  if(frases.length<2){
    cont.innerHTML=`<div class="box"><p class="note">Faltan las frases de este juego en el CONFIG.</p></div>`;
    return;
  }
  let i=0, ok=0;
  cont.innerHTML=`
    <div class="box">
      <div class="vf-prog" id="vfProg"></div>
      <div class="vf-frase" id="vfFrase"></div>
      <div class="vf-btns">
        <button class="btn" id="vfV">Verdadero</button>
        <button class="btn" id="vfF" style="background:var(--key);color:var(--ink);border:1px solid var(--card-border)">Falso</button>
      </div>
      <div class="result" id="vfResult"></div>
      <button class="btn" id="vfRetry" style="display:none">Otra vez</button>
    </div>`;
  function pintar(){
    document.getElementById("vfProg").textContent=`${i+1} / ${frases.length}`;
    document.getElementById("vfFrase").textContent=frases[i].t;
  }
  function responder(v){
    if(i>=frases.length) return;
    if(v===!!frases[i].v) ok++;
    i++;
    if(i<frases.length){ pintar(); return; }
    const r=document.getElementById("vfResult");
    document.getElementById("vfFrase").textContent="";
    document.getElementById("vfProg").textContent="";
    if(ok===frases.length){ r.textContent=`${ok}/${frases.length}. Perfecto, nos conocés entero.`; r.className="result ok"; celebrar(); }
    else { r.textContent=`${ok} de ${frases.length}… se puede mejorar 😏`; r.className="result bad";
      document.getElementById("vfRetry").style.display="inline-block"; }
  }
  document.getElementById("vfV").addEventListener("click",()=>responder(true));
  document.getElementById("vfF").addEventListener("click",()=>responder(false));
  document.getElementById("vfRetry").addEventListener("click",()=>montarVerdadFalso(a));
  pintar();
}

/* ===== el intruso (encontrá el emoji distinto) ===== */
function montarIntruso(a){
  const PARES=[["🌚","🌝"],["😺","😸"],["🐶","🦊"],["🍪","🥮"],["⭐","🌟"],["💙","💜"],["🐻","🐨"],["🌸","💮"]];
  const NIVELES=Math.min(5,Math.max(1,parseInt(a&&a.niveles,10)||3));
  let nivel=0;
  cont.innerHTML=`
    <div class="box">
      <p class="note" id="inNote"></p>
      <div id="intrusoGrid"></div>
      <div class="result" id="inResult"></div>
    </div>`;
  function pintar(){
    const [base,raro]=PARES[Math.floor(Math.random()*PARES.length)];
    const N=4+nivel;
    document.getElementById("inNote").textContent=`nivel ${nivel+1} de ${NIVELES}: tocá el que es distinto`;
    const g=document.getElementById("intrusoGrid");
    g.style.gridTemplateColumns=`repeat(${Math.min(N,5)},52px)`;
    g.innerHTML="";
    const total=Math.min(N,5)*Math.min(N,5);
    const idxRaro=Math.floor(Math.random()*total);
    for(let i=0;i<total;i++){
      const c=document.createElement("button");
      c.className="in-cel"; c.textContent=i===idxRaro?raro:base;
      c.addEventListener("click",()=>{
        if(i!==idxRaro) return;
        nivel++;
        if(nivel>=NIVELES){
          const r=document.getElementById("inResult");
          r.textContent="Ojo de águila. Los encontraste todos.";
          r.className="result ok";
          document.getElementById("intrusoGrid").innerHTML="";
          document.getElementById("inNote").textContent="";
          celebrar();
        } else pintar();
      });
      g.appendChild(c);
    }
  }
  pintar();
  window._dbg=window._dbg||{}; window._dbg.intruso={win:()=>{ nivel=NIVELES-1; const raro=[...document.querySelectorAll('.in-cel')].find((c,i,arr)=>arr.filter(x=>x.textContent===c.textContent).length===1); if(raro) raro.click(); }};
}

      <div class="loro-hint" id="loroHint">tocá al loro 🦜</div>
    </div>`;
  // precarga de los audios
  const players=lista.map(f=>{ try{ const au=new Audio(rutaAudio(f)); au.preload="auto"; return au; }catch(e){ return null; } });
  // el PRIMER audio de la lista suena una sola vez (presentación);
  // después los toques rotan en loop entre los demás
  let intro = players.length>1 && !!players[0];
  let idx=0, sonando=null;
  function proximo(){
    if(intro){ intro=false; return players[0]; }
    const resto = players.length>1 ? players.slice(1) : players;
    if(!resto.length) return null;
    for(let t=0;t<resto.length;t++){
      const p=resto[idx%resto.length]; idx++;
      if(p) return p;
    }
    return null;
  }
  const svg=document.getElementById("loroSvg");
  svg.addEventListener("click",()=>{
    // animación de hablar
    svg.classList.remove("loro-habla"); void svg.offsetWidth; svg.classList.add("loro-habla");
    clearTimeout(svg._hablaT);
    svg._hablaT=setTimeout(()=>svg.classList.remove("loro-habla"),700);
    // notas musicales + destellos
    const esc=document.getElementById("loroEscena");
    for(let i=0;i<3;i++){
      const n=document.createElement("span");
      n.className="loro-nota";
      n.textContent=["♪","♫","♬"][i%3];
      n.style.left=(40+Math.random()*26)+"%";
      n.style.top=(14+Math.random()*18)+"%";
      n.style.animationDelay=(i*0.12)+"s";
      esc.appendChild(n);
      setTimeout(()=>n.remove(),1700);
    }
    for(let i=0;i<3;i++){
      const c=document.createElement("span");
      c.className="loro-chispa"; c.textContent="✦";
      c.style.left=(22+Math.random()*56)+"%";
      c.style.top=(22+Math.random()*40)+"%";
      c.style.animationDelay=(i*0.08)+"s";
      esc.appendChild(c);
      setTimeout(()=>c.remove(),1100);
    }
    // reproducir: presentación la primera vez, después rotación
    if(sonando){ try{ sonando.pause(); sonando.currentTime=0; }catch(e){} }
    const p=proximo();
    if(p){
      sonando=p;
      svg.classList.add("loro-hablando");
      try{
        p.currentTime=0;
        const pr=p.play();
        if(pr&&pr.catch) pr.catch(()=>svg.classList.remove("loro-hablando"));
      }catch(e){ svg.classList.remove("loro-hablando"); }
    }
  });
  // cuando un audio termina, el pico deja de moverse
  players.forEach(p=>{ if(p) p.addEventListener("ended",()=>svg.classList.remove("loro-hablando")); });
  window._dbg=window._dbg||{}; window._dbg.loro={tocar:()=>svg.dispatchEvent(new Event("click")), lista, cual:()=>sonando?decodeURIComponent((sonando.src||"").split("/").pop()):null, audio:()=>sonando};
}

/* ===== wordle ===== */
function montarWordle(a){
  const limpiar=s=>String(s||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u0308]/g,"").replace(/[^A-ZÑ]/g,"");
  const P=limpiar(a.palabra||"PEQUE");
  const L=P.length, MAX=Math.max(3,parseInt(a.intentos,10)||6);
  const disp=(cont.clientWidth||340)-42;
  const dig=Math.max(28,Math.min(44,Math.floor((disp-(L-1)*6)/L)));
  cont.innerHTML=`
    <div class="box">
      <p class="note">adiviná la palabra de ${L} letras en ${MAX} intentos<br>🟩 en su lugar · 🟨 está en otro lugar</p>
      <div class="wd-filas" id="wdFilas"></div>
      <div class="juego-input">
        <input id="wdIn" maxlength="${L}" placeholder="${"·".repeat(L)}" autocomplete="off" autocapitalize="characters">
        <button class="btn" id="wdBtn" style="margin-top:0">Probar</button>
      </div>
      <div class="result" id="wdResult"></div>
      <button class="btn" id="wdRetry" style="display:none">Otra vez</button>
    </div>`;
  let usados=0, fin=false;
  function probar(){
    if(fin) return;
    const v=limpiar(document.getElementById("wdIn").value);
    const r=document.getElementById("wdResult");
    if(v.length!==L){ r.textContent=`Tiene ${L} letras.`; r.className="result bad"; return; }
    usados++;
    const fila=document.createElement("div"); fila.className="caja-fila";
    const resto=P.split(""), marca=Array(L).fill("no");
    for(let i=0;i<L;i++) if(v[i]===P[i]){ marca[i]="ok"; resto[i]=null; }
    for(let i=0;i<L;i++) if(marca[i]==="no"){ const j=resto.indexOf(v[i]); if(j>=0){ marca[i]="casi"; resto[j]=null; } }
    for(let i=0;i<L;i++){
      const d=document.createElement("div");
      d.className="caja-dig"+(marca[i]==="ok"?" ok":marca[i]==="casi"?" casi":"");
      d.style.width=dig+"px"; d.style.height=dig+"px"; d.style.fontSize=Math.round(dig*0.5)+"px";
      d.textContent=v[i]; fila.appendChild(d);
    }
    document.getElementById("wdFilas").appendChild(fila);
    document.getElementById("wdIn").value="";
    if(v===P){ fin=true; r.textContent="¡Esa es! Nos entendemos."; r.className="result ok"; celebrar(); return; }
    if(usados>=MAX){ fin=true; r.textContent="Era: "+P+". Reintentá."; r.className="result bad";
      document.getElementById("wdRetry").style.display="inline-block"; return; }
    r.textContent=`Intento ${usados} de ${MAX}.`; r.className="result";
  }
  document.getElementById("wdBtn").addEventListener("click",probar);
  document.getElementById("wdIn").addEventListener("keydown",e=>{ if(e.key==="Enter")probar(); });
  document.getElementById("wdRetry").addEventListener("click",()=>montarWordle(a));
  window._dbg=window._dbg||{}; window._dbg.wordle={probar,input:()=>document.getElementById("wdIn"),palabra:P};
}

/* ===== nexos (agrupar de a 4) ===== */
function montarNexos(a){
  const grupos=(a.grupos||[]).filter(g=>g&&g.palabras&&g.palabras.length===4).slice(0,4);
  if(grupos.length!==4){
    cont.innerHTML=`<div class="box"><p class="note">Nexos necesita 4 grupos de 4 palabras en el CONFIG.</p></div>`;
    return;
  }
  const COLORES=["#8BC79A","#F2C14E","#7FB3E8","#E8A0BF"];
  const todas=grupos.flatMap((g,gi)=>g.palabras.map(p=>({p:String(p).toUpperCase(),gi})));
  todas.sort(()=>Math.random()-0.5);
  cont.innerHTML=`
    <div class="box">
      <p class="note">agrupá las 16 palabras de a 4. Elegí 4 y probá.</p>
      <div id="nxSolved"></div>
      <div id="nxGrid"></div>
      <div class="nx-vidas" id="nxVidas"></div>
      <button class="btn" id="nxBtn">Probar grupo</button>
      <div class="result" id="nxResult"></div>
      <button class="btn" id="nxRetry" style="display:none">Otra vez</button>
    </div>`;
  let vidas=4, resueltos=new Set(), fin=false;
  const g=document.getElementById("nxGrid");
  const chips=todas.map(t=>{
    const c=document.createElement("button");
    c.className="nx-chip"; c.textContent=t.p; c.dataset.gi=t.gi;
    c.addEventListener("click",()=>{
      if(fin) return;
      if(c.classList.contains("sel")){ c.classList.remove("sel"); return; }
      if(g.querySelectorAll(".sel").length>=4) return;
      c.classList.add("sel");
    });
    g.appendChild(c);
    return c;
  });
  const pintarVidas=()=>document.getElementById("nxVidas").textContent="errores restantes: "+"●".repeat(vidas)+"○".repeat(4-vidas);
  pintarVidas();
  function resolverGrupo(gi,acierto){
    const grupo=grupos[gi]; resueltos.add(gi);
    const fila=document.createElement("div");
    fila.className="nx-grupo";
    fila.style.background=COLORES[gi];
    if(!acierto) fila.style.opacity=".55";
    fila.innerHTML=`<b>${grupo.nombre||("Grupo "+(gi+1))}</b><span>${grupo.palabras.join(" · ").toUpperCase()}</span>`;
    document.getElementById("nxSolved").appendChild(fila);
    chips.forEach(c=>{ if(parseInt(c.dataset.gi,10)===gi) c.remove(); });
  }
  document.getElementById("nxBtn").addEventListener("click",()=>{
    if(fin) return;
    const sel=[...g.querySelectorAll(".sel")];
    const r=document.getElementById("nxResult");
    if(sel.length!==4){ r.textContent="Elegí exactamente 4."; r.className="result bad"; return; }
    const gis=sel.map(c=>parseInt(c.dataset.gi,10));
    const gi=gis[0];
    if(gis.every(x=>x===gi)){
      resolverGrupo(gi,true);
      r.textContent="¡Grupo!"; r.className="result ok";
      if(resueltos.size===4){ fin=true; r.textContent="¡Los cuatro grupos! Genia."; celebrar(); }
    } else {
      vidas--; pintarVidas();
      sel.forEach(c=>c.classList.remove("sel"));
      const cuenta={}; gis.forEach(x=>cuenta[x]=(cuenta[x]||0)+1);
      const casi=Object.values(cuenta).some(n=>n===3);
      r.textContent = casi ? "¡Uno cerca! Tres eran del mismo grupo." : "No… esos no van juntos.";
      r.className="result bad";
      if(vidas<=0){
        fin=true;
        for(let i=0;i<4;i++) if(!resueltos.has(i)) resolverGrupo(i,false);
        r.textContent="Se acabaron los intentos. Así iban:";
        document.getElementById("nxRetry").style.display="inline-block";
      }
    }
  });
  document.getElementById("nxRetry").addEventListener("click",()=>montarNexos(a));
  window._dbg=window._dbg||{};
  window._dbg.nexos={grupos,
    marcar:(palabras)=>{ chips.forEach(c=>{ if(palabras.includes(c.textContent)) c.classList.add("sel"); }); },
    probar:()=>document.getElementById("nxBtn").click()};
}

/* ===== snake clásico ===== */
function montarSnake(a){
  const META=Math.max(5,parseInt(a.objetivo,10)||15);
  cont.innerHTML=`
    <div class="box" id="skBox">
      <div class="atrapar-hud"><span id="skPts">🍎 0 / ${META}</span><span id="skBest"></span></div>
      <canvas id="snakeCanvas" width="300" height="300"></canvas>
      <p class="note" style="margin-top:10px">deslizá el dedo sobre el tablero para girar</p>
      <div class="result" id="skResult"></div>
      <button class="btn" id="skBtn">Jugar</button>
    </div>`;
  const CV=document.getElementById("snakeCanvas"), CX=CV.getContext&&CV.getContext("2d");
  const N=15, CELL=20;
  let snake, dir, nextDir, food, timer=null, pts=0, logrado=false;
  /* sonido al comer: archivo configurable (a.sonido) o blip sintetizado */
  let actx=null, buf=null;
  (async()=>{
    if(!a.sonido) return;
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      const r=await fetch(rutaAudio(a.sonido));
      if(r.ok) buf=await actx.decodeAudioData(await r.arrayBuffer());
    }catch(e){}
  })();
  function comerSnd(){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==="suspended") actx.resume();
      if(buf){
        const s=actx.createBufferSource();
        s.buffer=buf; s.connect(actx.destination); s.start(0);
        return;
      }
      const t0=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
      o.type="triangle";
      o.frequency.setValueAtTime(440,t0);
      o.frequency.exponentialRampToValueAtTime(880,t0+0.09);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.18,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.12);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0+0.14);
    }catch(e){}
  }
  const best=()=>parseInt(leer("snake-best")||"0",10);
  const pintarBest=()=>document.getElementById("skBest").textContent="récord: "+best();
  pintarBest();
  function reset(){
    snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];
    dir={x:1,y:0}; nextDir=dir; pts=0; logrado=false;
    document.getElementById("skPts").textContent=`🍎 0 / ${META}`;
    comida(); dibujar();
  }
  function comida(){
    do{ food={x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function dibujar(){
    if(!CX) return;
    CX.clearRect(0,0,300,300);
    CX.font="16px serif"; CX.textAlign="center"; CX.textBaseline="middle";
    CX.fillText("🍎", food.x*CELL+10, food.y*CELL+11);
    snake.forEach((s,i)=>{
      CX.fillStyle = i===0 ? "#3E9B4F" : "#5FC46F";
      CX.beginPath();
      if(CX.roundRect) CX.roundRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4, 6);
      else CX.rect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4);
      CX.fill();
    });
  }
  function lograr(){
    if(logrado) return;
    logrado=true;
    const r=document.getElementById("skResult");
    r.textContent=`¡${META} manzanas! Objetivo cumplido, seguí por el récord.`;
    r.className="result ok";
    celebrar();
  }
  function paso(){
    dir=nextDir;
    const h={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){
      clearInterval(timer); timer=null;
      if(pts>best()) guardar("snake-best",String(pts));
      pintarBest();
      const r=document.getElementById("skResult");
      if(!logrado){ r.textContent=`${pts} de ${META}… otra vez.`; r.className="result bad"; }
      else { r.textContent=`Fin con ${pts} 🍎. Gran partida.`; r.className="result ok"; }
      const b=document.getElementById("skBtn");
      b.style.display="inline-block"; b.textContent="Jugar de nuevo";
      return;
    }
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){
      pts++; comerSnd();
      document.getElementById("skPts").textContent=`🍎 ${pts} / ${META}`;
      if(pts>=META) lograr();
      comida();
    } else snake.pop();
    dibujar();
  }
  function setDir(d){
    const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    const nd=m[d];
    if(nd && !(nd.x===-dir.x && nd.y===-dir.y)) nextDir=nd;
  }
  /* control 100% táctil sobre TODO el tablero, con scroll bloqueado */
  const box=document.getElementById("skBox");
  box.style.touchAction="none";
  box.addEventListener("touchmove",e=>{ e.preventDefault(); },{passive:false});
  let tS=null;
  box.addEventListener("touchstart",e=>{ if(e.target.tagName!=="BUTTON") tS=e.touches[0]; },{passive:true});
  box.addEventListener("touchend",e=>{
    if(!tS)return;
    const dx=e.changedTouches[0].clientX-tS.clientX, dy=e.changedTouches[0].clientY-tS.clientY;
    tS=null;
    if(Math.abs(dx)<22 && Math.abs(dy)<22) return; // toque corto: no es swipe
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?"right":"left");
    else setDir(dy>0?"down":"up");
  },{passive:true});
  document.getElementById("skBtn").addEventListener("click",function(){
    try{ if(actx&&actx.state==="suspended") actx.resume(); }catch(e){}
    this.style.display="none";
    document.getElementById("skResult").textContent="";
    clearInterval(timer); reset();
    timer=setInterval(paso,160);
  });
  reset();
  window._dbg=window._dbg||{}; window._dbg.snake={win:lograr, comer:comerSnd, girar:setDir};
}

/* ===== rompecabezas de foto (intercambio de piezas) ===== */
function montarFotoPuzzle(a){
  const C=Math.max(2,parseInt(a.columnas,10)||5), F=Math.max(2,parseInt(a.filas,10)||4);
  const N=C*F, archivo=rutaFoto(a.archivo)||"";

  cont.innerHTML=`
    <div class="box">
      <p class="note">tocá dos piezas para intercambiarlas y armá la foto</p>
      <div class="fz-marco"><div class="fz-grid" id="fpGrid" style="grid-template-columns:repeat(${C},${tw}px)"></div></div>
      <div class="result" id="fpResult"></div>
    </div>`;
  const img=new Image();
  img.onerror=()=>{ document.getElementById("fpResult").textContent=`No encontré la foto ${archivo}. ¿Está subida al repositorio?`; };
  img.src=archivo;
  let pos=[...Array(N).keys()];
  do{ pos.sort(()=>Math.random()-0.5); }while(pos.every((v,i)=>v===i));
  const g=document.getElementById("fpGrid");
  let sel=null, fin=false;
  function bg(el,pieza){
    el.style.width=tw+"px"; el.style.height=th+"px";
    el.style.backgroundImage=`url("${archivo}")`;
    el.style.backgroundSize=`${C*tw}px ${F*th}px`;
    el.style.backgroundPosition=`-${(pieza%C)*tw}px -${Math.floor(pieza/C)*th}px`;
  }
  function pintar(){
    g.innerHTML="";
    pos.forEach((pieza,i)=>{
      const d=document.createElement("div");
      d.className="fz-tile"; bg(d,pieza);
      d.addEventListener("click",()=>{
        if(fin) return;
        if(sel===null){ sel=i; pintar(); g.children[i].classList.add("sel"); return; }
        if(sel!==i){ [pos[sel],pos[i]]=[pos[i],pos[sel]]; }
        sel=null; pintar(); chequear();
      });
      g.appendChild(d);
    });
  }
  function chequear(){
    if(pos.every((v,i)=>v===i)){
      fin=true; g.classList.add("fz-listo");
      const r=document.getElementById("fpResult");
      r.textContent="¡Foto armada! 📸"; r.className="result ok";
      celebrar();
    }
  }
  pintar();
  window._dbg=window._dbg||{}; window._dbg.fpz={set:(p)=>{pos=p.slice();pintar();},swap:(i,j)=>{[pos[i],pos[j]]=[pos[j],pos[i]];pintar();chequear();},estado:()=>pos.slice()};
}

/* ===== rompecabezas deslizante de foto ===== */
function montarDeslizante(a){
  const T=Math.min(5,Math.max(3,parseInt(a.tam,10)||4));
  const N=T*T, archivo=rutaFoto(a.archivo)||"";
  const disp=(cont.clientWidth||340)-46;
  const tw=Math.floor(disp/T), th=tw;
  cont.innerHTML=`
    <div class="box">
      <p class="note">falta una pieza: deslizá las demás hasta armar la foto</p>
      <div class="fz-marco"><div class="fz-grid" id="dzGrid" style="grid-template-columns:repeat(${T},${tw}px)"></div></div>
      <div class="result" id="dzResult"></div>
      <button class="btn" id="dzMezclar">Mezclar de nuevo</button>
    </div>`;
  const img=new Image();
  img.onerror=()=>{ document.getElementById("dzResult").textContent=`No encontré la foto ${archivo}. ¿Está subida al repositorio?`; };
  img.src=archivo;
  let board, fin=false;
  function mezclar(){
    board=[...Array(N).keys()]; // N-1 = hueco
    let hueco=N-1, prev=-1;
    for(let m=0;m<T*T*12;m++){
      const x=hueco%T, y=Math.floor(hueco/T), vecinos=[];
      if(x>0)vecinos.push(hueco-1); if(x<T-1)vecinos.push(hueco+1);
      if(y>0)vecinos.push(hueco-T); if(y<T-1)vecinos.push(hueco+T);
      const cand=vecinos.filter(v=>v!==prev);
      const el=cand[Math.floor(Math.random()*cand.length)];
      board[hueco]=board[el]; board[el]=N-1;
      prev=hueco; hueco=el;
    }
    fin=false;
  }
  const g=document.getElementById("dzGrid");
  function pintar(){
    g.classList.remove("fz-listo");
    g.innerHTML="";
    board.forEach((pieza,i)=>{
      const d=document.createElement("div");
      d.style.width=tw+"px"; d.style.height=th+"px";
      if(pieza===N-1 && !fin){ d.className="fz-tile hueco"; }
      else{
        d.className="fz-tile";
        d.style.backgroundImage=`url("${archivo}")`;
        d.style.backgroundSize=`${T*tw}px ${T*th}px`;
        d.style.backgroundPosition=`-${(pieza%T)*tw}px -${Math.floor(pieza/T)*th}px`;
      }
      d.addEventListener("click",()=>mover(i));
      g.appendChild(d);
    });
    if(fin) g.classList.add("fz-listo");
  }
  function mover(i){
    if(fin) return;
    const hueco=board.indexOf(N-1);
    const xi=i%T, yi=Math.floor(i/T), xh=hueco%T, yh=Math.floor(hueco/T);
    if(Math.abs(xi-xh)+Math.abs(yi-yh)!==1) return;
    [board[hueco],board[i]]=[board[i],board[hueco]];
    if(board.every((v,k)=>v===k)){
      fin=true;
      const r=document.getElementById("dzResult");
      r.textContent="¡Completa! Hasta apareció la pieza que faltaba."; r.className="result ok";
      celebrar();
    }
    pintar();
  }
  document.getElementById("dzMezclar").addEventListener("click",()=>{ document.getElementById("dzResult").textContent=""; mezclar(); pintar(); });
  mezclar(); pintar();
  window._dbg=window._dbg||{}; window._dbg.dz={set:(b)=>{board=b.slice();pintar();},mover,estado:()=>board.slice()};
}

      <div class="ep-contador" id="epNum">0</div>
      <div class="ep-hito" id="epHito"></div>
      <div class="ep-titulo" id="epTitulo"><b>${TOTAL.toLocaleString("es-AR")} días</b><span>${a.subtitulo||"y contando"}</span></div>
      <div class="ep-hint${a.cancion?" ver":""}" id="epHint">${a.cancion?"tocá la estrella para empezar ✦":""}</div>
    </div>
    <div class="ep-visor" id="epVisor"><img id="epFoto" alt="recuerdo"></div>`;
  /* la carta vive arriba en el HTML (por el sobre de los días normales);
     en el día épico la movemos DEBAJO del cielo para que aparezca
     después de la estrella, nunca encima */
  cont.appendChild(document.getElementById("letter"));
  /* canción de apertura: intenta sola; si iOS la bloquea, con el primer toque */
  let musica=null, tocarMusica=()=>{};
  if(a.cancion){
    musica=new Audio(rutaAudio(a.cancion));
    musica.volume=0.55;
    tocarMusica=()=>{ try{ const pr=musica.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){} };
  }
  const cv=document.getElementById("epCanvas");
  /* fondo del día: tu imagen a PANTALLA COMPLETA, oscurecida,
     con el cielo de estrellas flotando encima */
  if(a.fondo){
    /* capa fija propia (el fondo "fixed" del body está roto en iOS:
       deja una franja gris hasta que scrolleás) */
    let fx=document.getElementById("epFondoFull");
    if(!fx){
      fx=document.createElement("div");
      fx.id="epFondoFull";
      document.body.prepend(fx);
    }
    fx.style.cssText="position:fixed;inset:0;z-index:-3;"+
      `background:url("${rutaFoto(a.fondo)}") center/cover no-repeat;`;
    document.body.style.backgroundImage="none";
    document.body.style.backgroundColor="#171310";
    document.body.classList.add("with-image");
    document.body.classList.remove("light-text-off");
  }
  const ctx=cv.getContext&&cv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  const SW=window.innerWidth||393, SH=window.innerHeight||780;
  if(ctx){ cv.width=SW*dpr; cv.height=SH*dpr; ctx.scale(dpr,dpr); }
  const CX=SW/2, CY=SH*0.42;
  /* el bloque en flujo reserva lugar para que la carta aparezca debajo de la estrella */
  
  const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* vértices de la estrella de 5 puntas */
  const R=Math.min(SW*0.36,185), RI=R*0.42;
  /* capa del cielo ANCLADA A LA PÁGINA (no a la pantalla): al scrollear,
     la estrella sube con el contenido y nunca se superpone con la carta */
  const capa=document.createElement("div");
  capa.id="epCapa";
  capa.style.cssText="position:absolute;top:0;left:0;width:100%;height:"+SH+"px;z-index:-1;pointer-events:none;";
  document.body.appendChild(capa);
  capa.appendChild(cv);
  capa.appendChild(document.getElementById("epNum"));
  capa.appendChild(document.getElementById("epHito"));
  capa.appendChild(document.getElementById("epTitulo"));
  capa.appendChild(document.getElementById("epHint"));
  document.getElementById("epEscena").style.height=Math.round(CY+R+150)+"px";
  document.getElementById("epTitulo").style.top=Math.round(CY+R+22)+"px";
  document.getElementById("epHint").style.top=Math.round(CY+R+92)+"px";
  const V=[];
  for(let i=0;i<10;i++){
    const ang=(-90+i*36)*Math.PI/180;
    const r=i%2===0?R:RI;
    V.push({x:CX+r*Math.cos(ang), y:CY+r*Math.sin(ang)});
  }
  function puntoEstrella(u,rel){
    const seg=Math.floor(u*10)%10, t=(u*10)%1;
    const ax=V[seg].x+(V[(seg+1)%10].x-V[seg].x)*t;
    const ay=V[seg].y+(V[(seg+1)%10].y-V[seg].y)*t;
    return { x:CX+(ax-CX)*rel, y:CY+(ay-CY)*rel };
  }
  const COLORES=["#F2C14E","#F2C14E","#FDF3D8","#F08CB0"];
  const P=[];
  for(let i=0;i<TOTAL;i++){
    const dest=puntoEstrella(Math.random(), Math.pow(Math.random(),0.42));
    P.push({
      x:Math.random()*SW, y:Math.random()*SH,
      vx:(Math.random()-.5)*.14, vy:(Math.random()-.5)*.14,
      tx:dest.x, ty:dest.y, sx:0, sy:0,
      r:Math.random()<.06?1.8:1.1,
      c:COLORES[Math.floor(Math.random()*COLORES.length)],
      tw:Math.random()*Math.PI*2,
      delay:Math.random()*0.55
    });
  }
  /* estrellas especiales: una por foto, repartidas por toda la estrella */
  const ESP=FOTOS.map((f,i)=>{
    const u=(i+0.5)/FOTOS.length;
    const rel=0.55+((i*37)%40)/100;
    const p=puntoEstrella(u,Math.min(1,rel));
    return { x:p.x, y:p.y, foto:f, tw:Math.random()*Math.PI*2, ok:false, src:"" };
  });
  /* precarga verificadora: solo brillan las estrellas cuya foto existe.
     Prueba cada nombre y sus variantes (.jpg / .JPG / .jpeg) */
  (function precargarFotos(){
    const variantes=f=>{
      const v=[f];
      const t=f.replace(/\.jpg$/i,m=>m===".jpg"?".JPG":".jpg"); if(t!==f) v.push(t);
      const j=f.replace(/\.(jpg|JPG)$/,".jpeg"); if(j!==f) v.push(j);
      return v;
    };
    ESP.forEach(es=>{
      const cand=variantes(es.foto); let i=0;
      const probar=()=>{
        if(i>=cand.length) return;
        const im=new Image();
        im.onload=()=>{ es.ok=true; es.src=rutaFoto(cand[i]); };
        im.onerror=()=>{ i++; probar(); };
        im.src=rutaFoto(cand[i]);
      };
      probar();
    });
  })();
  let fase=(a.cancion?"intro":"contando"), t0=performance.now(), tForma=0, pulso=0, fugaces=[];
  function empezar(){
    if(fase!=="intro") return;
    tocarMusica();
    fase="contando"; t0=performance.now();
    const hint=document.getElementById("epHint");
    hint.classList.remove("ver");
  }
  if(a.cancion && musica){
    /* si el navegador permite autoplay, la intro se saltea sola */
    musica.addEventListener("playing",()=>{ if(fase==="intro"){ fase="contando"; t0=performance.now(); document.getElementById("epHint").classList.remove("ver"); } },{once:true});
    tocarMusica();
  }
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  let hitoIdx=0, hitoTimer=null;
  function mostrarHito(hh){
    const el=document.getElementById("epHito");
    el.innerHTML=`<small>día ${hh.dia.toLocaleString("es-AR")}</small>${hh.texto}`;
    el.classList.add("ver");
    clearTimeout(hitoTimer);
    hitoTimer=setTimeout(()=>el.classList.remove("ver"),1900);
  }
  function terminarConteo(){
    if(fase!=="contando") return;
    fase="formando"; tForma=performance.now();
    P.forEach(p=>{ p.sx=p.x; p.sy=p.y; });
    const n=document.getElementById("epNum");
    n.textContent=TOTAL.toLocaleString("es-AR");
    n.classList.add("final");
    document.getElementById("epHito").classList.remove("ver");
    setTimeout(()=>{
      n.classList.add("fuera");
      document.getElementById("epTitulo").classList.add("ver");
      const hint=document.getElementById("epHint");
      hint.textContent = ESP.length ? "tocá las estrellas más brillantes ✦" : "tocá el cielo ✦";
      hint.classList.add("ver");
      celebrar();
      const l=document.getElementById("letter");
      pintarCarta(); l.style.display="block"; tipearCarta();
      setTimeout(()=>{
        try{ window.scrollTo({top:Math.max(0,l.offsetTop-Math.round(SH*0.34)), behavior:"smooth"}); }catch(e){}
      },900);
    }, DUR_FORMA+300);
  }
  function frame(now){
    ctx.clearRect(0,0,SW,SH);
    if(fase==="intro"){
      /* cielo en calma esperando el toque: pocas estrellas tenues + una que late */
      for(let i=0;i<90;i++){
        const p=P[i];
        p.x+=p.vx*0.5; p.y+=p.vy*0.5;
        if(p.x<2||p.x>SW-2) p.vx*=-1;
        if(p.y<2||p.y>SH-2) p.vy*=-1;
        p.tw+=0.03;
        ctx.globalAlpha=0.18+0.14*Math.sin(p.tw);
        ctx.fillStyle=p.c;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      }
      const lat=1+0.14*Math.sin(now*0.0035);
      ctx.globalAlpha=0.9;
      ctx.fillStyle="#F2C14E";
      ctx.shadowColor="#F2C14E"; ctx.shadowBlur=18*lat;
      ctx.beginPath(); ctx.arc(CX,CY,5*lat,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle="rgba(242,193,78,.85)";
      ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.moveTo(CX-14*lat,CY); ctx.lineTo(CX+14*lat,CY);
      ctx.moveTo(CX,CY-14*lat); ctx.lineTo(CX,CY+14*lat);
      ctx.stroke();
      ctx.globalAlpha=1;
      requestAnimationFrame(frame);
      return;
    }
    if(fase==="contando"){
      const t=Math.min(1,(now-t0)/(reduceMotion?600:DUR_CONTEO));
      const n=Math.max(1,Math.floor(ease(t)*TOTAL));
      document.getElementById("epNum").textContent=n.toLocaleString("es-AR");
      while(hitoIdx<HITOS.length && HITOS[hitoIdx].dia<=n){ mostrarHito(HITOS[hitoIdx]); hitoIdx++; }
      for(let i=0;i<TOTAL;i++){
        const p=P[i];
        if(i>=n) continue;
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<2||p.x>SW-2) p.vx*=-1;
        if(p.y<2||p.y>SH-2) p.vy*=-1;
        p.tw+=0.05;
        ctx.globalAlpha=0.55+0.45*Math.sin(p.tw);
        ctx.fillStyle=p.c;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      if(t>=1) terminarConteo();
    } else {
      const tf=fase==="formando" ? Math.min(1,(now-tForma)/DUR_FORMA) : 1;
      if(fase==="formando" && tf>=1) fase="listo";
      if(pulso>0) pulso=Math.max(0,pulso-0.03);
      const lat=1+pulso*0.07*Math.sin(pulso*10);
      for(const p of P){
        let x,y;
        if(fase==="formando"){
          const local=Math.min(1,Math.max(0,(tf-p.delay*0.4)/(1-p.delay*0.4)));
          const e=ease(local);
          x=p.sx+(p.tx-p.sx)*e; y=p.sy+(p.ty-p.sy)*e;
        } else {
          p.tw+=0.04;
          x=CX+(p.tx-CX)*lat+Math.sin(p.tw)*0.6;
          y=CY+(p.ty-CY)*lat+Math.cos(p.tw*0.9)*0.6;
        }
        p.x=x; p.y=y;
        ctx.globalAlpha=0.55+0.45*Math.sin(p.tw+p.delay*9);
        ctx.fillStyle=p.c;
        ctx.beginPath(); ctx.arc(x,y,p.r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      /* estrellas especiales (las que guardan fotos): más grandes, con destello */
      if(fase==="listo"){
        for(const e of ESP){
          if(!e.ok) continue;
          e.tw+=0.06;
          const ex=CX+(e.x-CX)*lat, ey=CY+(e.y-CY)*lat;
          const b=0.7+0.3*Math.sin(e.tw);
          ctx.globalAlpha=b;
          ctx.fillStyle="#FFFFFF";
          ctx.shadowColor="#F2C14E"; ctx.shadowBlur=9;
          ctx.beginPath(); ctx.arc(ex,ey,2.7,0,Math.PI*2); ctx.fill();
          ctx.shadowBlur=0;
          ctx.strokeStyle="rgba(255,255,255,"+(b*0.8)+")";
          ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(ex-5.5,ey); ctx.lineTo(ex+5.5,ey);
          ctx.moveTo(ex,ey-5.5); ctx.lineTo(ex,ey+5.5);
          ctx.stroke();
        }
        ctx.globalAlpha=1;
      }
      for(let i=fugaces.length-1;i>=0;i--){
        const f=fugaces[i];
        f.x+=f.vx; f.y+=f.vy; f.vida-=0.02;
        if(f.vida<=0){ fugaces.splice(i,1); continue; }
        ctx.strokeStyle="rgba(242,193,78,"+f.vida+")";
        ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x-f.vx*7,f.y-f.vy*7); ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  if(ctx){
    requestAnimationFrame(frame);
  } else {
    /* sin canvas: mostrar directamente el estado final */
    fase="listo";
    document.getElementById("epHint").textContent = ESP.length ? "tocá las estrellas más brillantes ✦" : "tocá el cielo ✦";
    document.getElementById("epNum").textContent=TOTAL.toLocaleString("es-AR");
    document.getElementById("epTitulo").classList.add("ver");
    document.getElementById("epHint").classList.add("ver");
  }
  /* visor de fotos con zoom desde la estrellita */
  const visor=document.getElementById("epVisor");
  const foto=document.getElementById("epFoto");
  function abrirFoto(e,ex,ey){
    foto._alt=0;
    foto.src=e.src||rutaFoto(e.foto);
    const dx=ex-window.innerWidth/2;
    const dy=(ey-(window.scrollY||0))-window.innerHeight/2;
    foto.style.transition="none";
    foto.style.transform=`translate(${dx}px,${dy}px) scale(.1)`;
    visor.style.display="flex";
    requestAnimationFrame(()=>{
      foto.style.transition="";
      visor.classList.add("ver");
      foto.style.transform="";
    });
  }
  function cerrarFoto(){
    visor.classList.remove("ver");
    setTimeout(()=>{ visor.style.display="none"; },280);
  }
  visor.addEventListener("click",cerrarFoto);
  foto.addEventListener("error",()=>{
    /* reintento automático: .jpg <-> .JPG <-> .jpeg */
    const src=foto.getAttribute("src")||"";
    const intentos=foto._alt||0;
    const variantes=[s=>s.replace(/\.jpg$/i,m=>m===".jpg"?".JPG":".jpg"),
                     s=>s.replace(/\.(jpg|JPG)$/,".jpeg")];
    if(intentos<variantes.length){
      foto._alt=intentos+1;
      const nueva=variantes[intentos](src);
      if(nueva!==src){ foto.src=nueva; return; }
    }
    foto._alt=0; cerrarFoto();
  });
  document.addEventListener("click",e=>{
    if(e.target.closest && (e.target.closest("#epVisor")||e.target.closest("#letter"))) return;
    if(fase==="intro"){ empezar(); return; }
    if(fase==="contando"){ terminarConteo(); return; }
    if(fase==="listo" && ESP.length){
      const mx=e.clientX, my=e.clientY+(window.scrollY||0);
      let mejor=null, md=999;
      for(const es of ESP){
        if(!es.ok) continue;
        const d=Math.hypot(es.x-mx, es.y-my);
        if(d<md){ md=d; mejor=es; }
      }
      if(mejor && md<=17){ abrirFoto(mejor,mejor.x,mejor.y); return; }
    }
    pulso=1;
    fugaces.push({x:Math.random()*SW*0.7+SW*0.15, y:SH*0.10, vx:-(2+Math.random()*2), vy:2.4+Math.random()*1.6, vida:1});
  });
  window._dbg=window._dbg||{}; window._dbg.epico={saltar:terminarConteo, empezar, fase:()=>fase, total:TOTAL,
    especiales:()=>ESP.length, listas:()=>ESP.filter(e=>e.ok).length, esp:ESP,
    abrir:(i)=>{const o=ESP.filter(e=>e.ok); if(o[i]) abrirFoto(o[i],o[i].x,o[i].y);}, cerrar:cerrarFoto,
    fotoSrc:()=>foto.src};
}

/* ===== trivia ===== */
function montarTrivia(a){
  const ops=(a.opciones||[]).map((o,i)=>
    `<button class="trivia-op" data-i="${i+1}">${o}</button>`).join("");
  cont.innerHTML=`
    <div class="box" style="text-align:left">
      <div class="trivia-q">${a.pregunta||""}</div>
      ${ops}
      <div class="result" id="trResult" style="text-align:center"></div>
    </div>`;
  const correcta=parseInt(a.respuesta,10);
  document.querySelectorAll(".trivia-op").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll(".trivia-op").forEach(x=>x.disabled=true);
      const i=parseInt(b.dataset.i,10);
      const r=document.getElementById("trResult");
      const bOk=document.querySelector(`.trivia-op[data-i="${correcta}"]`);
      if(bOk) bOk.classList.add("ok");
      if(i===correcta){
        r.textContent=a.acierto||"¡Correcto!";
        r.className="result ok";
        celebrar();
      } else {
        b.classList.add("bad");
        r.textContent=a.error||"Mmm… no.";
        r.className="result bad";
      }
    });
  });
}

/* ===== ahorcado clásico ===== */
function montarAhorcado(palabra){
  const P=String(Array.isArray(palabra)?palabra[0]:(palabra||"SORPRESA"))
    .normalize("NFD").replace(/[\u0300-\u0308]/g,"").toUpperCase();
  cont.innerHTML=`
    <div class="box">
      <svg id="gallows" width="150" height="160" viewBox="0 0 150 160">
        <line x1="15" y1="150" x2="95" y2="150"/>
        <line x1="40" y1="150" x2="40" y2="15"/>
        <line x1="40" y1="15" x2="105" y2="15"/>
        <line x1="105" y1="15" x2="105" y2="35"/>
        <circle class="part" id="p0" cx="105" cy="49" r="14"/>
        <line class="part" id="p1" x1="105" y1="63" x2="105" y2="105"/>
        <line class="part" id="p2" x1="105" y1="73" x2="85"  y2="92"/>
        <line class="part" id="p3" x1="105" y1="73" x2="125" y2="92"/>
        <line class="part" id="p4" x1="105" y1="105" x2="88"  y2="130"/>
        <line class="part" id="p5" x1="105" y1="105" x2="122" y2="130"/>
      </svg>
      <div class="word" id="ahorWord"></div>
      <div class="kbd" id="ahorKbd"></div>
      <div class="result" id="ahorResult"></div>
      <button class="btn" id="ahorRetry" style="display:none">Reintentar</button>
    </div>`;
  let ok=new Set(), err=0, fin=false;
  const pintar=()=>{
    document.getElementById("ahorWord").textContent =
      P.split("").map(l=>ok.has(l)?l:"_").join(" ");
  };
  const terminar=(win)=>{
    fin=true;
    document.querySelectorAll("#ahorKbd button").forEach(b=>b.disabled=true);
    const r=document.getElementById("ahorResult");
    r.textContent = win ? "La sacaste. Bien ahí." : "Nada… era: "+P;
    r.className = "result "+(win?"ok":"bad");
    if(win) celebrar();
    if(!win) document.getElementById("ahorRetry").style.display="inline-block";
  };
  const kbd=document.getElementById("ahorKbd");
  "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("").forEach(L=>{
    const b=document.createElement("button");
    b.textContent=L;
    b.addEventListener("click",()=>{
      if(fin) return;
      b.disabled=true;
      if(P.includes(L)){
        ok.add(L); pintar();
        if(P.split("").every(l=>ok.has(l))) terminar(true);
      } else {
        document.getElementById("p"+err).style.visibility="visible";
        err++;
        if(err>=6) terminar(false);
      }
    });
    kbd.appendChild(b);
  });
  document.getElementById("ahorRetry").addEventListener("click",()=>montarAhorcado(P));
  pintar();
}

/* ===== sopa de letras ===== */
function montarSopa(palabras){
  const limpiar=w=>w.toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u0302\u0308]/g,"")
    .replace(/[^A-ZÑ]/g,"");
  let words=[...new Set((palabras||["EJEMPLO"]).map(limpiar).filter(w=>w.length>1))];

  words=words.filter(w=>w.length<=12);
  const SN=Math.max(9, Math.min(12, ...[12], Math.max(...words.map(w=>w.length), 9)));
  const dirs=[[1,0],[0,1],[1,1],[-1,1]];

  function generar(){
    const grid=Array.from({length:SN},()=>Array(SN).fill(""));
    const orden=[...words].sort((a,b)=>b.length-a.length);
    for(const w of orden){
      let puesta=false;
      for(let t=0;t<600 && !puesta;t++){
        const [dx,dy]=dirs[Math.floor(Math.random()*dirs.length)];
        const x0=Math.floor(Math.random()*SN), y0=Math.floor(Math.random()*SN);
        const xe=x0+dx*(w.length-1), ye=y0+dy*(w.length-1);
        if(xe<0||xe>=SN||ye<0||ye>=SN) continue;
        let ok=true;
        for(let i=0;i<w.length;i++){
          const c=grid[y0+dy*i][x0+dx*i];
          if(c!=="" && c!==w[i]){ok=false;break;}
        }
        if(!ok) continue;
        for(let i=0;i<w.length;i++) grid[y0+dy*i][x0+dx*i]=w[i];
        puesta=true;
      }
      if(!puesta) return null;
    }
    return grid;
  }
  let grid=null;
  for(let i=0;i<40 && !grid;i++) grid=generar();
  if(!grid && words.length>1){
    words.sort((a,b)=>a.length-b.length).pop();
    for(let i=0;i<40 && !grid;i++) grid=generar();
  }
  if(!grid){
    cont.innerHTML=`<div class="box"><p class="note">No pude armar la sopa con esas palabras. Probá con menos o más cortas.</p></div>`;
    return;
  }

  const disp=(cont.clientWidth||340)-42;
  const cell=Math.max(19,Math.min(32,Math.floor((disp-(SN-1)*3)/SN)));
  const fSopa=Math.max(10,Math.round(cell*0.5));
  cont.innerHTML=`
    <div class="box">
      <p class="note">tocá la primera y la última letra de cada palabra</p>
      <div id="sopaGrid"></div>
      <div class="sopa-words" id="sopaWords"></div>
      <div class="result" id="sopaResult"></div>
    </div>`;
  const AB="ABCDEFGHIJLMNOPRSTUV";
  for(let y=0;y<SN;y++)for(let x=0;x<SN;x++)
    if(grid[y][x]==="") grid[y][x]=AB[Math.floor(Math.random()*AB.length)];

  const g=document.getElementById("sopaGrid");
  g.style.gridTemplateColumns=`repeat(${SN},${cell}px)`;
  let start=null, found=new Set();
  const cellEl=(x,y)=>g.querySelector(`div[data-x="${x}"][data-y="${y}"]`);
  for(let y=0;y<SN;y++)for(let x=0;x<SN;x++){
    const d=document.createElement("div");
    d.textContent=grid[y][x]; d.dataset.x=x; d.dataset.y=y;
    d.style.width=cell+"px"; d.style.height=cell+"px";
    d.style.fontSize=fSopa+"px";
    d.addEventListener("click",()=>{
      if(!start){ start={x,y,el:d}; d.classList.add("sel"); return; }
      start.el.classList.remove("sel");
      const {x:x0,y:y0}=start; start=null;
      const dx=Math.sign(x-x0), dy=Math.sign(y-y0);
      const len=Math.max(Math.abs(x-x0),Math.abs(y-y0))+1;
      const aligned=(x0===x)||(y0===y)||(Math.abs(x-x0)===Math.abs(y-y0));
      if(!aligned) return;
      let cells=[], str="";
      for(let i=0;i<len;i++){
        const cx=x0+dx*i, cy=y0+dy*i;
        cells.push([cx,cy]); str+=grid[cy][cx];
      }
      const rev=str.split("").reverse().join("");
      const hit=words.find(w=>(w===str||w===rev)&&!found.has(w));
      if(hit){
        found.add(hit);
        cells.forEach(([cx,cy])=>cellEl(cx,cy).classList.add("found"));
        document.getElementById("sw-"+hit).classList.add("done");
        if(found.size===words.length){
          const r=document.getElementById("sopaResult");
          r.textContent="Las encontraste todas.";
          r.className="result ok";
          celebrar();
        }
      }
    });
    g.appendChild(d);
  }
  const wl=document.getElementById("sopaWords");
  words.forEach(w=>{
    const s=document.createElement("span");
    s.textContent=w; s.id="sw-"+w;
    wl.appendChild(s);
  });
}
