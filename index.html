/* ===== quiz (varias preguntas seguidas) ===== */
function montarQuiz(a){
  const qs=(a.preguntas||[]).slice();
  if(!qs.length) return;
  const MIN=Math.min(qs.length, parseInt(a.minimo,10)||qs.length);
  let idx=0, aciertos=0;
  function pintar(){
    const q=qs[idx];
    cont.innerHTML=`
      <div class="box" style="text-align:left">
        <div class="vf-prog" style="margin-bottom:8px">PREGUNTA ${idx+1} / ${qs.length}</div>
        <div class="trivia-q">${q.pregunta||""}</div>
        ${(q.opciones||[]).map((o,i)=>`<button class="trivia-op" data-i="${i+1}">${o}</button>`).join("")}
        <div class="result" id="qzResult" style="text-align:center"></div>
      </div>`;
    const correcta=parseInt(q.respuesta,10);
    document.querySelectorAll("#actividad .trivia-op").forEach(b=>{
      b.addEventListener("click",()=>{
        document.querySelectorAll("#actividad .trivia-op").forEach(x=>x.disabled=true);
        const i=parseInt(b.dataset.i,10);
        const bOk=document.querySelector(`#actividad .trivia-op[data-i="${correcta}"]`);
        if(bOk) bOk.classList.add("ok");
        if(i===correcta) aciertos++;
        else b.classList.add("bad");
        setTimeout(()=>{ idx++; idx<qs.length ? pintar() : terminar(); },900);
      });
    });
  }
  function terminar(){
    const win=aciertos>=MIN;
    cont.innerHTML=`
      <div class="box">
        <div class="trivia-q" style="text-align:center">${aciertos} de ${qs.length} correctas</div>
        <div class="result ${win?"ok":"bad"}">${win?"Aprobadísima. Nos conocés.":"Mmm… vamos de nuevo, que esto es importante."}</div>
        ${win?"":'<button class="btn" id="qzBtn">Reintentar</button>'}
      </div>`;
    if(win) celebrar();
    else document.getElementById("qzBtn").addEventListener("click",()=>{ idx=0; aciertos=0; pintar(); });
  }
  pintar();
  window._dbg=window._dbg||{}; window._dbg.quiz={win:()=>{aciertos=qs.length;terminar();}};
}

/* ===== constelación (unir estrellas en orden) ===== */
function montarConstelacion(a){
  a=a||{};
  cont.innerHTML=`
    <div class="box">
      <p class="note">uní las estrellas en orden, del 1 en adelante</p>
      <canvas id="constCanvas" width="300" height="310"></canvas>
      <div class="result" id="csResult"></div>
    </div>`;
  const CV=document.getElementById("constCanvas"), CX=CV.getContext("2d");
  let pts=[], txtFinal="Un corazón. Obvio que era un corazón.";
  if(a.forma==="torre"){
    /* silueta de la Torre Eiffel, con el arco de abajo */
    pts=[
      {x:78,y:288},{x:112,y:196},{x:132,y:120},{x:143,y:52},
      {x:150,y:26},{x:157,y:52},{x:168,y:120},{x:188,y:196},
      {x:222,y:288},{x:182,y:288},{x:150,y:232},{x:118,y:288}
    ];
    txtFinal="La Torre Eiffel ✦ ahora andá a verla de verdad.";
  } else {
    for(let i=0;i<12;i++){
      const t=Math.PI/2 - (i/12)*Math.PI*2;   /* arranca arriba y gira */
      const x=16*Math.pow(Math.sin(t),3);
      const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      pts.push({x:150+x*7.6, y:128-y*7.2});
    }
  }
  const N=pts.length;
  let prox=0, listo=false, err=0;
  function dibujar(){
    CX.clearRect(0,0,300,310);
    const acc=getComputedStyle(document.documentElement).getPropertyValue("--acc").trim()||"#E4B75B";
    if(listo){
      CX.beginPath();
      pts.forEach((p,i)=> i?CX.lineTo(p.x,p.y):CX.moveTo(p.x,p.y));
      CX.closePath();
      CX.fillStyle=acc+"33"; CX.fill();
    }
    CX.strokeStyle=acc; CX.lineWidth=2; CX.lineCap="round";
    CX.beginPath();
    for(let i=0;i<(listo?N:prox);i++){
      const p=pts[i];
      i?CX.lineTo(p.x,p.y):CX.moveTo(p.x,p.y);
    }
    if(listo){ CX.closePath(); }
    CX.stroke();
    pts.forEach((p,i)=>{
      const hecho=i<prox||listo;
      const esProx=!listo&&i===prox;
      CX.save();
      if(esProx){
        const pulso=1+Math.sin(Date.now()/220)*.25;
        CX.translate(p.x,p.y); CX.scale(pulso,pulso); CX.translate(-p.x,-p.y);
      }
      CX.fillStyle = hecho?acc:(err&&esProx?"#DB8A7C":"rgba(255,255,255,.75)");
      CX.beginPath(); CX.arc(p.x,p.y,hecho?5:4,0,7); CX.fill();
      CX.restore();
      if(!listo){
        CX.fillStyle=hecho?acc:"rgba(255,255,255,.6)";
        CX.font="bold 10px sans-serif"; CX.textAlign="center";
        CX.fillText(i+1, p.x, p.y-11);
      }
    });
  }
  let anim=setInterval(dibujar,90);
  function ganarC(){
    listo=true; clearInterval(anim); dibujar();
    const r=document.getElementById("csResult");
    r.textContent=txtFinal;
    r.className="result ok";
    celebrar();
  }
  function tocar(e){
    if(listo) return;
    e.preventDefault();
    const rect=CV.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    const x=(t.clientX-rect.left)*(300/rect.width);
    const y=(t.clientY-rect.top)*(310/rect.height);
    const p=pts[prox];
    if(Math.hypot(x-p.x,y-p.y)<26){
      prox++; err=0;
      if(prox>=N) ganarC();
    } else if(pts.some(q=>Math.hypot(x-q.x,y-q.y)<20)){
      err=1; setTimeout(()=>{err=0;},350);
    }
    dibujar();
  }
  CV.addEventListener("touchstart",tocar,{passive:false});
  CV.addEventListener("mousedown",tocar);
  dibujar();
  window._dbg=window._dbg||{}; window._dbg.constelacion={win:ganarC};
}

/* ===== globos (reventar y encontrar las letras) ===== */
function montarGlobos(a){
  const palabra=String(a.palabra||"TE AMO").toUpperCase();
  const letras=palabra.split("").map((ch,i)=>({ch,i})).filter(o=>o.ch!==" ");
  const decoys=["🎉","✦","🎊","💫","⭐"];
  const items=letras.map(o=>({tipo:"letra",...o}))
    .concat(decoys.map(d=>({tipo:"decoy",ch:d})));
  items.sort(()=>Math.random()-0.5);
  cont.innerHTML=`
    <div class="box">
      <p class="note">reventá los globos: adentro hay letras escondidas</p>
      <div id="globosZona"></div>
      <div class="globos-slots" id="globosSlots"></div>
      <div class="result" id="gbResult"></div>
    </div>`;
  const slots=document.getElementById("globosSlots");
  palabra.split("").forEach((ch,i)=>{
    const d=document.createElement("div");
    if(ch===" "){ d.style.width="14px"; }
    else { d.className="caja-dig"; d.id="gslot-"+i; }
    slots.appendChild(d);
  });
  const zona=document.getElementById("globosZona");
  const tintes=[0,40,90,160,210,280,320];
  let quedan=letras.length;
  items.forEach((it,k)=>{
    const g=document.createElement("span");
    g.className="globo"; g.textContent="🎈";
    g.style.filter=`hue-rotate(${tintes[k%tintes.length]}deg)`;
    g.style.left=(4+(k%4)*24+Math.random()*6)+"%";
    g.style.top=(4+Math.floor(k/4)*30+Math.random()*8)+"%";
    g.style.animationDelay=(-Math.random()*3)+"s";
    const pop=e=>{
      e.preventDefault();
      if(g.dataset.pop) return;
      g.dataset.pop="1";
      g.classList.add("globo-pop");
      const chip=document.createElement("span");
      chip.className="loro-nota";
      chip.textContent=it.tipo==="letra"?it.ch:it.ch;
      chip.style.left=g.style.left; chip.style.top=g.style.top;
      chip.style.fontSize="1.5rem"; chip.style.fontWeight="800";
      zona.appendChild(chip);
      setTimeout(()=>chip.remove(),1400);
      setTimeout(()=>g.remove(),300);
      if(it.tipo==="letra"){
        const s=document.getElementById("gslot-"+it.i);
        if(s){ s.textContent=it.ch; s.classList.add("ok"); }
        quedan--;
        if(quedan<=0){
          const r=document.getElementById("gbResult");
          r.textContent="La palabra era esa, sí: "+palabra.toLowerCase()+".";
          r.className="result ok";
          celebrar();
        }
      }
    };
    g.addEventListener("touchstart",pop,{passive:false});
    g.addEventListener("mousedown",pop);
    zona.appendChild(g);
  });
  window._dbg=window._dbg||{}; window._dbg.globos={win:()=>{
    document.querySelectorAll("#globosZona .globo").forEach(g=>g.dispatchEvent(new Event("mousedown")));
  }};
}

/* ===== flappy (la estrellita voladora) ===== */
function montarFlappy(a){
  const META=Math.max(3,parseInt(a.objetivo,10)||10);
  const EMO=a.emoji||"⭐";
  cont.innerHTML=`
    <div class="box" id="flBox">
      <div class="atrapar-hud"><span id="flPts">✦ 0 / ${META}</span><span id="flBest"></span></div>
      <canvas id="flapCanvas" width="300" height="360"></canvas>
      <p class="note" style="margin-top:10px">tocá el cielo para aletear y pasá entre los aros</p>
      <div class="result" id="flResult"></div>
      <button class="btn" id="flBtn">Jugar</button>
    </div>`;
  const CV=document.getElementById("flapCanvas"), CX=CV.getContext("2d");
  const W=300,H=360;
  let y,vy,tubos,pts,vivo=false,logrado=false,raf=null,frame=0;
  const best=()=>parseInt(leer("flappy-best")||"0",10);
  const pintarBest=()=>document.getElementById("flBest").textContent="récord: "+best();
  pintarBest();
  function reset(){
    y=H/2; vy=0; tubos=[]; pts=0; frame=0; logrado=false;
    document.getElementById("flPts").textContent=`✦ 0 / ${META}`;
  }
  function fin(){
    vivo=false; cancelAnimationFrame(raf);
    if(pts>best()) guardar("flappy-best",String(pts));
    pintarBest();
    const r=document.getElementById("flResult");
    if(!logrado){ r.textContent=`${pts} de ${META}… ${EMO==="⭐"?"la estrellita cree en vos":"otro intento, que el vuelo recién empieza"}.`; r.className="result bad"; }
    else { r.textContent=`Fin con ${pts} aros. Vuelo estelar.`; r.className="result ok"; }
    const b=document.getElementById("flBtn");
    b.style.display="inline-block"; b.textContent="Jugar de nuevo";
  }
  function lograr(){
    if(logrado) return;
    logrado=true;
    const r=document.getElementById("flResult");
    r.textContent=`¡${META} aros! Objetivo cumplido, seguí por el récord.`;
    r.className="result ok";
    celebrar();
  }
  function paso(){
    frame++;
    vy+=0.42; y+=vy;
    if(frame%92===1){
      const gap=118, gy=60+Math.random()*(H-120-gap);
      tubos.push({x:W+20, gy, gap, w:34, pasado:false});
    }
    tubos.forEach(t=>t.x-=2.2);
    tubos=tubos.filter(t=>t.x>-40);
    const sx=70, r=13;
    for(const t of tubos){
      if(!t.pasado && t.x+t.w<sx){
        t.pasado=true; pts++;
        document.getElementById("flPts").textContent=`✦ ${pts} / ${META}`;
        if(pts>=META) lograr();
      }
      if(sx+r>t.x && sx-r<t.x+t.w && (y-r<t.gy || y+r>t.gy+t.gap)) return fin();
    }
    if(y+r>H||y-r<0) return fin();
    const acc=getComputedStyle(document.documentElement).getPropertyValue("--acc").trim()||"#E4B75B";
    CX.clearRect(0,0,W,H);
    tubos.forEach(t=>{
      CX.fillStyle=acc;
      CX.beginPath();
      if(CX.roundRect){ CX.roundRect(t.x,0,t.w,t.gy,8); CX.roundRect(t.x,t.gy+t.gap,t.w,H-t.gy-t.gap,8); }
      else { CX.rect(t.x,0,t.w,t.gy); CX.rect(t.x,t.gy+t.gap,t.w,H-t.gy-t.gap); }
      CX.fill();
    });
    CX.font="26px serif"; CX.textAlign="center"; CX.textBaseline="middle";
    CX.save();
    CX.translate(sx,y); CX.rotate(Math.max(-0.4,Math.min(0.6,vy*0.06)));
    CX.fillText(EMO,0,0);
    CX.restore();
    raf=requestAnimationFrame(paso);
  }
  function flap(e){
    if(e){ e.preventDefault(); }
    if(!vivo) return;
    vy=-6.4;
  }
  CV.addEventListener("touchstart",flap,{passive:false});
  CV.addEventListener("mousedown",flap);
  document.getElementById("flBtn").addEventListener("click",function(){
    this.style.display="none";
    document.getElementById("flResult").textContent="";
    reset(); vivo=true; raf=requestAnimationFrame(paso);
  });
  reset();
  CX.font="26px serif"; CX.textAlign="center"; CX.textBaseline="middle";
  CX.fillText(EMO,70,H/2);
  window._dbg=window._dbg||{}; window._dbg.flappy={win:lograr};
}

/* ===== runner (la estrellita corre y salta) ===== */
function montarRunner(a){
  const META=Math.max(3,parseInt(a.objetivo,10)||12);
  const JUG=a.jugador||"⭐", OBS=a.obstaculo||"🌵", NOM=a.nombre||"cactus";
  cont.innerHTML=`
    <div class="box" id="runBox">
      <div class="atrapar-hud"><span id="runPts">${OBS} 0 / ${META}</span><span id="runBest"></span></div>
      <canvas id="runCanvas" width="300" height="190"></canvas>
      <p class="note" style="margin-top:10px">tocá el tablero para saltar los ${NOM}</p>
      <div class="result" id="runResult"></div>
      <button class="btn" id="runBtn">Jugar</button>
    </div>`;
  const CV=document.getElementById("runCanvas"), CX=CV.getContext("2d");
  const W=300,H=190,SUELO=158,SX=56;
  let y,vy,obs,pts,vel,vivo=false,logrado=false,raf=null,frame=0,prox=0;
  const best=()=>parseInt(leer("runner-best")||"0",10);
  const pintarBest=()=>document.getElementById("runBest").textContent="récord: "+best();
  pintarBest();
  function reset(){
    y=SUELO; vy=0; obs=[]; pts=0; vel=3; frame=0; prox=50; logrado=false;
    document.getElementById("runPts").textContent=`${OBS} 0 / ${META}`;
  }
  function fin(){
    vivo=false; cancelAnimationFrame(raf);
    if(pts>best()) guardar("runner-best",String(pts));
    pintarBest();
    const r=document.getElementById("runResult");
    if(!logrado){ r.textContent=`${pts} de ${META}… ese último jugó sucio.`; r.className="result bad"; }
    else { r.textContent=`Fin con ${pts} ${OBS}. Qué piernas.`; r.className="result ok"; }
    const b=document.getElementById("runBtn");
    b.style.display="inline-block"; b.textContent="Jugar de nuevo";
  }
  function lograr(){
    if(logrado) return;
    logrado=true;
    const r=document.getElementById("runResult");
    r.textContent=`¡${META} ${NOM} saltados! Seguí por el récord.`;
    r.className="result ok";
    celebrar();
  }
  function paso(){
    frame++;
    vy+=0.52; y+=vy;
    if(y>SUELO){ y=SUELO; vy=0; }
    if(frame>=prox){
      obs.push({x:W+16,pasado:false});
      prox=frame+55+Math.random()*65-Math.min(20,pts);
    }
    obs.forEach(o=>o.x-=vel);
    obs=obs.filter(o=>o.x>-30);
    vel=3+Math.min(2.4,pts*0.12);
    for(const o of obs){
      if(!o.pasado && o.x<SX-16){
        o.pasado=true; pts++;
        document.getElementById("runPts").textContent=`${OBS} ${pts} / ${META}`;
        if(pts>=META) lograr();
      }
      if(Math.abs(o.x-SX)<20 && y>SUELO-26) return fin();
    }
    CX.clearRect(0,0,W,H);
    CX.strokeStyle="rgba(255,255,255,.35)"; CX.lineWidth=2;
    CX.beginPath(); CX.moveTo(0,SUELO+16); CX.lineTo(W,SUELO+16); CX.stroke();
    CX.font="24px serif"; CX.textAlign="center"; CX.textBaseline="middle";
    obs.forEach(o=>CX.fillText(OBS,o.x,SUELO+2));
    CX.font="26px serif";
    CX.fillText(JUG,SX,y-6);
    raf=requestAnimationFrame(paso);
  }
  function saltar(e){
    if(e){ e.preventDefault(); }
    if(!vivo) return;
    if(y>=SUELO) vy=-9.4;
  }
  CV.addEventListener("touchstart",saltar,{passive:false});
  CV.addEventListener("mousedown",saltar);
  document.getElementById("runBtn").addEventListener("click",function(){
    this.style.display="none";
    document.getElementById("runResult").textContent="";
    reset(); vivo=true; raf=requestAnimationFrame(paso);
  });
  reset();
  CX.font="26px serif"; CX.textAlign="center"; CX.textBaseline="middle";
  CX.fillText(JUG,SX,SUELO-6);
  window._dbg=window._dbg||{}; window._dbg.runner={win:lograr};
}

/* ===== breakout (rompebloques) ===== */
function montarBreakout(a){
  const VIDAS=Math.max(1,parseInt(a.vidas,10)||3);
  cont.innerHTML=`
    <div class="box" id="brkBox">
      <div class="atrapar-hud"><span id="brPts">🧱 0</span><span id="brVidas"></span></div>
      <canvas id="brkCanvas" width="300" height="360"></canvas>
      <p class="note" style="margin-top:10px">deslizá el dedo para mover la paleta</p>
      <div class="result" id="brResult"></div>
      <button class="btn" id="brBtn">Jugar</button>
    </div>`;
  const CV=document.getElementById("brkCanvas"), CX=CV.getContext("2d");
  const W=300,H=360,PW=66,PH=10,PY=332,R=6;
  const COLS=6,FILAS=5,BW=44,BH=15,GAP=4,TOP=42;
  const colores=["#F2C14E","#E8955C","#E86A7C","#F08CB0","#B48CF2"];
  let px,bx,by,vx,vy,bricks,rotos,vidas,vivo=false,raf=null,pegado=true;
  function armar(){
    bricks=[];
    for(let f=0;f<FILAS;f++)for(let c=0;c<COLS;c++)
      bricks.push({x:GAP+c*(BW+GAP)+4, y:TOP+f*(BH+GAP), f, ok:true});
    rotos=0;
  }
  function pintarVidas(){
    document.getElementById("brVidas").textContent="♥".repeat(vidas);
  }
  function reset(){
    px=W/2; bx=W/2; by=PY-14; vx=2.4*(Math.random()<0.5?1:-1); vy=-3.1;
    pegado=true;
  }
  function fin(win){
    vivo=false; cancelAnimationFrame(raf);
    const r=document.getElementById("brResult");
    if(win){
      r.textContent="Todos los bloques rotos. Demoledora.";
      r.className="result ok";
      celebrar();
    } else {
      r.textContent=`${rotos} de ${COLS*FILAS} bloques… otra vez.`;
      r.className="result bad";
      const b=document.getElementById("brBtn");
      b.style.display="inline-block"; b.textContent="Reintentar";
    }
  }
  function dibujar(){
    CX.clearRect(0,0,W,H);
    bricks.forEach(b=>{
      if(!b.ok) return;
      CX.fillStyle=colores[b.f%colores.length];
      CX.beginPath();
      if(CX.roundRect) CX.roundRect(b.x,b.y,BW,BH,4); else CX.rect(b.x,b.y,BW,BH);
      CX.fill();
    });
    const acc=getComputedStyle(document.documentElement).getPropertyValue("--acc").trim()||"#E4B75B";
    CX.fillStyle=acc;
    CX.beginPath();
    if(CX.roundRect) CX.roundRect(px-PW/2,PY,PW,PH,5); else CX.rect(px-PW/2,PY,PW,PH);
    CX.fill();
    CX.font="13px serif"; CX.textAlign="center"; CX.textBaseline="middle";
    CX.fillText("💛",bx,by);
  }
  function paso(){
    if(pegado){ bx=px; by=PY-14; }
    else {
      bx+=vx; by+=vy;
      if(bx<R||bx>W-R) vx=-vx;
      if(by<R) vy=Math.abs(vy);
      if(by>PY-R-2 && by<PY+PH && Math.abs(bx-px)<PW/2+R){
        vy=-Math.abs(vy);
        vx += (bx-px)/(PW/2)*1.6;
        vx=Math.max(-4,Math.min(4,vx));
      }
      if(by>H+20){
        vidas--; pintarVidas();
        if(vidas<=0) return fin(false);
        reset();
      }
      for(const b of bricks){
        if(!b.ok) continue;
        if(bx>b.x-R && bx<b.x+BW+R && by>b.y-R && by<b.y+BH+R){
          b.ok=false; rotos++;
          document.getElementById("brPts").textContent=`🧱 ${rotos}`;
          const dxl=Math.min(Math.abs(bx-b.x),Math.abs(bx-b.x-BW));
          const dyl=Math.min(Math.abs(by-b.y),Math.abs(by-b.y-BH));
          if(dxl<dyl) vx=-vx; else vy=-vy;
          if(rotos>=COLS*FILAS) return fin(true);
          break;
        }
      }
    }
    dibujar();
    raf=requestAnimationFrame(paso);
  }
  function mover(e){
    e.preventDefault();
    const rect=CV.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    px=Math.max(PW/2,Math.min(W-PW/2,(t.clientX-rect.left)*(W/rect.width)));
    if(pegado && vivo && e.type==="touchstart") pegado=false;
  }
  CV.addEventListener("touchstart",e=>{ mover(e); if(vivo) pegado=false; },{passive:false});
  CV.addEventListener("touchmove",mover,{passive:false});
  CV.addEventListener("mousedown",e=>{ mover(e); if(vivo) pegado=false; });
  CV.addEventListener("mousemove",e=>{ if(e.buttons) mover(e); });
  document.getElementById("brBtn").addEventListener("click",function(){
    this.style.display="none";
    document.getElementById("brResult").textContent="";
    armar(); vidas=VIDAS; pintarVidas();
    document.getElementById("brPts").textContent="🧱 0";
    reset(); vivo=true; raf=requestAnimationFrame(paso);
  });
  armar(); vidas=VIDAS; pintarVidas(); reset(); dibujar();
  window._dbg=window._dbg||{}; window._dbg.breakout={win:()=>fin(true)};
}

/* ===== dosmil (2048 de corazones) ===== */
function montarDosmil(a){
  const META=parseInt(a.objetivo,10)||128;
  const CORAZON={2:"🤍",4:"💛",8:"🧡",16:"❤️",32:"💖",64:"💗",128:"💞",256:"💕",512:"💘",1024:"💝",2048:"❤️‍🔥"};
  cont.innerHTML=`
    <div class="box" id="dmBox">
      <div class="atrapar-hud"><span>llegá al ${META} ${CORAZON[META]||"💞"}</span><span id="dmBest"></span></div>
      <div id="dmGrid"></div>
      <p class="note" style="margin-top:10px">deslizá para juntar corazones iguales</p>
      <div class="result" id="dmResult"></div>
      <button class="btn" id="dmBtn" style="display:none">Jugar de nuevo</button>
    </div>`;
  let g,logrado=false,fin=false;
  const best=()=>parseInt(leer("dosmil-best")||"0",10);
  const pintarBest=()=>document.getElementById("dmBest").textContent="récord: "+best();
  pintarBest();
  function vacias(){ const v=[]; for(let i=0;i<16;i++) if(!g[i]) v.push(i); return v; }
  function spawn(){
    const v=vacias(); if(!v.length) return;
    g[v[Math.floor(Math.random()*v.length)]]=Math.random()<0.9?2:4;
  }
  function pintar(nuevos){
    const grid=document.getElementById("dmGrid");
    grid.innerHTML="";
    g.forEach((n,i)=>{
      const d=document.createElement("div");
      d.className="dm-cel"+((nuevos&&nuevos.has(i))?" nuevo":"");
      if(n) d.innerHTML=`<span>${CORAZON[n]||"❤️‍🔥"}</span><b>${n}</b>`;
      grid.appendChild(d);
    });
  }
  function linea(idx){
    const vals=idx.map(i=>g[i]).filter(Boolean);
    const out=[]; let sumado=false, movio=false;
    for(let i=0;i<vals.length;i++){
      if(i<vals.length-1 && vals[i]===vals[i+1]){
        out.push(vals[i]*2); i++; sumado=true;
      } else out.push(vals[i]);
    }
    while(out.length<idx.length) out.push(0);
    idx.forEach((gi,k)=>{
      if(g[gi]!==out[k]) movio=true;
      g[gi]=out[k]||0;
    });
    return movio||sumado;
  }
  function mover(dir){
    if(fin) return;
    let movio=false;
    for(let f=0;f<4;f++){
      let idx;
      if(dir==="left")  idx=[0,1,2,3].map(c=>f*4+c);
      if(dir==="right") idx=[3,2,1,0].map(c=>f*4+c);
      if(dir==="up")    idx=[0,1,2,3].map(r=>r*4+f);
      if(dir==="down")  idx=[3,2,1,0].map(r=>r*4+f);
      if(linea(idx)) movio=true;
    }
    if(!movio) return;
    spawn();
    pintar();
    const max=Math.max(...g);
    if(max>best()){ guardar("dosmil-best",String(max)); pintarBest(); }
    if(!logrado && max>=META){
      logrado=true;
      const r=document.getElementById("dmResult");
      r.textContent=`¡${META}! Objetivo cumplido, podés seguir sumando amor.`;
      r.className="result ok";
      celebrar();
    }
    if(!vacias().length && !hayMovida()){
      fin=true;
      const r=document.getElementById("dmResult");
      if(!logrado){ r.textContent="Sin movidas… se juega de nuevo."; r.className="result bad"; }
      else { r.textContent="Tablero lleno. Gran cosecha."; r.className="result ok"; }
      document.getElementById("dmBtn").style.display="inline-block";
    }
  }
  function hayMovida(){
    for(let f=0;f<4;f++)for(let c=0;c<4;c++){
      const v=g[f*4+c];
      if(c<3 && v===g[f*4+c+1]) return true;
      if(f<3 && v===g[(f+1)*4+c]) return true;
    }
    return false;
  }
  function empezar(){
    g=Array(16).fill(0); logrado=false; fin=false;
    document.getElementById("dmResult").textContent="";
    document.getElementById("dmBtn").style.display="none";
    spawn(); spawn(); pintar();
  }
  const box=document.getElementById("dmBox");
  box.style.touchAction="none";
  box.addEventListener("touchmove",e=>{ e.preventDefault(); },{passive:false});
  let tS=null;
  box.addEventListener("touchstart",e=>{ if(e.target.tagName!=="BUTTON") tS=e.touches[0]; },{passive:true});
  box.addEventListener("touchend",e=>{
    if(!tS) return;
    const dx=e.changedTouches[0].clientX-tS.clientX, dy=e.changedTouches[0].clientY-tS.clientY;
    tS=null;
    if(Math.abs(dx)<24 && Math.abs(dy)<24) return;
    if(Math.abs(dx)>Math.abs(dy)) mover(dx>0?"right":"left");
    else mover(dy>0?"down":"up");
  },{passive:true});
  document.addEventListener("keydown",e=>{
    const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};
    if(m[e.key]){ e.preventDefault(); mover(m[e.key]); }
  });
  document.getElementById("dmBtn").addEventListener("click",empezar);
  empezar();
  window._dbg=window._dbg||{}; window._dbg.dosmil={win:()=>{g[0]=META;mover("left");}, mover};
}

/* ===== gala (gran final de temporada) ===== */
function montarGala(){
  const fechas=fechasTemporada();
  const ganados=fechas.map(f=>leer("stk-"+f)).filter(Boolean);
  const TOTAL=Math.max(20,fechas.length);
  cont.innerHTML=`
    <div class="gala-escena" id="galaEscena">
      <div class="gala-titulo">${(CONFIG.temporada&&CONFIG.temporada.nombre)||"La temporada"}</div>
      <div class="gala-sub" id="galaSub">juntaste ${ganados.length} de ${fechas.length} estrellas</div>
      <div class="gala-btn-zona" id="galaBtnZona">
        <button class="btn" id="galaBtn">✦ Ver el gran final</button>
      </div>
    </div>`;
  const esc=document.getElementById("galaEscena");
  const stars=[];
  for(let i=0;i<TOTAL;i++){
    const s=document.createElement("span");
    s.className="gala-star";
    s.textContent=ganados[i]||"✦";
    s.style.fontSize=(ganados[i]?1.5:1.05)+"rem";
    if(!ganados[i]) s.style.color="var(--acc)";
    s.style.left=(5+Math.random()*86)+"%";
    s.style.top=(12+Math.random()*70)+"%";
    s.style.animationDelay=(-Math.random()*3)+"s";
    esc.appendChild(s);
    stars.push(s);
  }
  let hecho=false;
  function final(){
    if(hecho) return;
    hecho=true;
    document.getElementById("galaBtnZona").style.display="none";
    const w=esc.offsetWidth, h=esc.offsetHeight;
    const cx=w/2, cy=h*0.42, esc2=Math.min(w,h)/42;
    stars.forEach((s,i)=>{
      const t=Math.PI/2 - (i/TOTAL)*Math.PI*2;
      const x=16*Math.pow(Math.sin(t),3);
      const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      s.style.left=(cx+x*esc2-10)+"px";
      s.style.top=(cy-y*esc2-10)+"px";
    });
    setTimeout(()=>{
      confetti();
      try{ otorgarSticker(); }catch(e){}
      const l=document.getElementById("letter");
      l.style.display="block";
      tipearCarta();
      const ev=CONFIG.proximoEvento;
      if(ev&&ev.fecha){
        const n=Math.round((new Date(ev.fecha+"T00:00:00")-fechaHoyDate())/86400000);
        if(n>0) document.getElementById("galaSub").textContent=
          `y en ${n} días… tres cifras ✦`;
      }
      if(l.scrollIntoView) setTimeout(()=>l.scrollIntoView({behavior:"smooth",block:"center"}),400);
    },2500);
  }
  document.getElementById("galaBtn").addEventListener("click",final);
  window._dbg=window._dbg||{}; window._dbg.gala={fin:final};
}
</script>
